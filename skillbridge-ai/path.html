<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เส้นทางการเรียน — SkillBridge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">🛸 SkillBridge AI</a>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="assessment.html">แบบทดสอบ</a>
      <a href="passport.html">พาสปอร์ตทักษะ</a>
      <a href="dashboard.html">แดชบอร์ด</a>
      <a href="path.html">เส้นทางการเรียน</a>
    </nav>
    <div class="nav-actions">
      <a class="btn btn-lime" href="dashboard.html">ภาพรวม</a>
    </div>
  </header>

  <main>
    <section class="block">
      <h2>🪐 แผนที่ดาว 8 สัปดาห์ สู่นักวิเคราะห์ธุรกิจ</h2>
      <p class="sub">แต่ละดาวคือบทเรียนหนึ่งดวง — ยิ่งเดินทาง ยิ่งปลดล็อกดาวใหม่</p>

      <div class="path-map" id="pathMap"></div>
    </section>

    <!-- panel รายละเอียดบทเรียน -->
    <div class="mascot-chat" id="lessonPanel" style="right:50%; transform:translateX(50%); bottom:120px; width:340px;">
      <h3 id="lessonTitle" style="margin-bottom:6px;"></h3>
      <p class="desc" id="lessonDesc" style="margin-bottom:14px;"></p>
      <button class="btn btn-lime" id="startLessonBtn" style="width:100%;">เริ่มเรียน</button>
    </div>
  </main>

  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    const icons = { done: "✔️", current: "🪐", locked: "🌑" };
    const states = { done: "เรียนแล้ว", current: "กำลังเรียน", locked: "ยังไม่ปลดล็อก" };
    const map = document.getElementById("pathMap");
    let path = window.MOCK_DATA.learningPath;
    function renderPath(items) {
      path = items;
      map.innerHTML = path.map((n, i) => `
      <div class="node-item ${n.state}">
        <div class="node-dot" data-i="${i}" title="${n.title}">${icons[n.state]}</div>
        <div class="node-info" style="padding-top:12px;">
          <div class="node-state">${states[n.state]} · ใช้เวลา ~${n.hours} ชั่วโมง</div>
          <h4>${i + 1}. ${n.title}</h4>
          <p class="desc">${n.desc}</p>
        </div>
      </div>`).join("");
    }
    function aiPathToUi(data) {
      return (data.learning_path || []).map((step, i) => ({ title: `${step.skill} — ${step.topic}`, desc: step.reason, state: i === 0 ? "current" : "locked", hours: 1 }));
    }

    async function loadPath() {
      const cached = sessionStorage.getItem("sbLearningPath");
      if (cached) { try { const parsed = JSON.parse(cached); if (parsed.learning_path) return renderPath(aiPathToUi(parsed)); } catch (e) { console.warn("Invalid cached learning path.", e); } }
      const userId = sessionStorage.getItem("sbUserId");
      if (!userId) return renderPath(path);
      try {
        const [dashboard, skillResponse] = await Promise.all([window.SkillBridgeAPI.getDashboard(userId), window.SkillBridgeAPI.getDashboardSkills(userId)]);
        const rows = skillResponse && Array.isArray(skillResponse.skills) ? skillResponse.skills : [];
        if (!rows.length) { console.info("Personalized path waiting for real user skill scores; using fallback path."); return renderPath(path); }
        const current = Object.fromEntries(rows.map(s => [s.skill_name, Number(s.score)]));
        const generated = await window.SkillBridgeAPI.generateLearningPath({ target_career: dashboard && dashboard.target_career || "Data Analyst", current_skills: current });
        sessionStorage.setItem("sbLearningPath", JSON.stringify(generated));
        renderPath(aiPathToUi(generated));
      } catch (error) { console.warn("Personalized path unavailable; using fallback path.", error); renderPath(path); }
    }
    loadPath();

    const panel = document.getElementById("lessonPanel");
    map.addEventListener("click", (e) => {
      const dot = e.target.closest(".node-dot");
      if (!dot) return;
      const n = path[+dot.dataset.i];
      if (n.state === "locked") return;
      document.getElementById("lessonTitle").textContent = n.title;
      document.getElementById("lessonDesc").textContent = n.desc + ` (ประมาณ ${n.hours} ชั่วโมง)`;
      panel.classList.add("open");
    });

    document.getElementById("startLessonBtn").onclick = () =>
      alert("เนื้อหาบทเรียนจะเชื่อมกับระบบเรียนรู้หลังต่อฐานข้อมูล 🛸");
  </script>
</body>
</html>
