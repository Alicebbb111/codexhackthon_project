<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Skill Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-container h2 { margin-bottom: 24px; color: #333333; font-weight: 600; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; color: #666666; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #667eea; }
        .btn-submit { width: 100%; padding: 12px; background: #667eea; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #5a6fd6; }
        #error-message { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>SkillBridge AI</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">ชื่อผู้ใช้</label>
                <!-- ช่องกรอก Username -->
                <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้งาน">
            </div>
            
            <div class="input-group">
                <label for="password">รหัสผ่าน</label>
                <!-- ช่องกรอก Password -->
                <input type="password" id="password" required placeholder="กรอกรหัสผ่าน">
            </div>

            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        </form>

        <div id="error-message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // ดึงค่า Username และ Password จากช่องกรอก
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.style.display = 'none';

            try {
                // ส่งข้อมูลไปยัง Backend API (/api/login)
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("เข้าสู่ระบบสำเร็จ!");
                    // เก็บข้อมูล user ไว้ในเครื่องเพื่อเอาไปใช้ต่อหน้าแดชบอร์ด
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // พาไปหน้าถัดไป (เปลี่ยนเป็นชื่อไฟล์หน้าแดชบอร์ดของคุณ)
                    window.location.href = 'dashboard.html'; 
                } else {
                    errorDiv.textContent = data.error || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้";
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
