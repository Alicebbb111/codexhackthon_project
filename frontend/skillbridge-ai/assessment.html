<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แบบทดสอบ — SkillBridge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* เฉพาะหน้านี้: การ์ดอาชีพ, ผลหมวด, feedback ถูก/ผิด */
    .career-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .career-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; cursor: pointer; text-align: center; font-family: inherit; color: var(--text);
    }
    .career-card:hover { border-color: var(--lime); }
    .career-card.selected { border-color: var(--lime); background: rgba(166,255,77,.1); box-shadow: var(--glow-lime); }
    .career-card .ic { font-size: 1.8rem; display: block; margin-bottom: 6px; }

    .feedback { margin-left: 62px; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; font-size: .95rem; }
    .feedback.correct { background: rgba(77,232,176,.12); border: 1px solid rgba(77,232,176,.4); color: var(--mint); }
    .feedback.wrong { background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.35); color: #ff9d9d; }

    .cat-chip {
      display: inline-block; font-size: .74rem; font-weight: 700; padding: 3px 12px;
      border-radius: 999px; margin-bottom: 8px; letter-spacing: .3px;
    }
    .cat-chip.technical { background: rgba(139,123,255,.15); color: #b3a8ff; border: 1px solid rgba(139,123,255,.4); }
    .cat-chip.soft { background: rgba(77,232,176,.12); color: var(--mint); border: 1px solid rgba(77,232,176,.35); }
    .cat-chip.career { background: rgba(166,255,77,.12); color: var(--lime); border: 1px solid rgba(166,255,77,.35); }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 18px; }
    .res-card { text-align: center; padding: 22px 16px; }
    .res-card .pct { font-size: 2.1rem; font-weight: 800; color: var(--lime); }
    .res-card .name { color: var(--text-dim); font-size: .9rem; margin-top: 4px; }

    /* จัดบทสนทนาและปุ่มให้อยู่กึ่งกลางจอ */
    .chat-box { display: flex; flex-direction: column; align-items: center; }
    .chat-box .bubble { align-self: center; }
    .chat-box .msg { text-align: center; }
    .choices { justify-content: center; margin: 8px auto 20px; max-width: 640px; }
    .career-grid { max-width: 640px; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">🛸 SkillBridge AI</a>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="assessment.html">แบบทดสอบ</a>
      <a href="passport.html">พาสปอร์ตทักษะ</a>
      <a href="dashboard.html">แดชบอร์ด</a>
      <a href="path.html">เส้นทางการเรียน</a>
    </nav>
    <div class="nav-actions">
      <button class="btn btn-ghost" id="calmBtn" title="โหมดใจเย็น">🧘 โหมดใจเย็น</button>
    </div>
  </header>

  <main>
    <div class="progress-bridge" id="bridge" style="visibility: hidden;">
      <div class="walker" id="walker"></div>
      <div class="track"></div>
    </div>

    <div class="chat-box" id="chatBox"></div>
    <div class="choices" id="choicesBox"></div>
    <div id="extraBox"></div>
  </main>

  <script src="js/mockData.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script>
    let quiz = window.MOCK_DATA.quiz;
    const skillIds = { Excel: 1, SQL: 2, Python: 3, Statistics: 4, "Data Visualization": 5 };
    const careers = window.MOCK_DATA.careers;
    const profiles = window.MOCK_DATA.careerProfiles;

    let step = 0;              // 0 = ทักทาย, 1 = ฟอร์มเลือกอาชีพ, 2+ = ควิซ
    let careerChoice = null;   // อาชีพที่ผู้เรียนเลือก
    const answers = [];        // [{ category, skill_name, skill_id, index, correct|null, score }]
    const chatBox = document.getElementById("chatBox");
    const choicesBox = document.getElementById("choicesBox");
    const extraBox = document.getElementById("extraBox");
    const bridge = document.getElementById("bridge");
    const walker = document.getElementById("walker");

    function addBubble(html, isUser = false) {
      chatBox.insertAdjacentHTML("beforeend", `
        <div class="bubble ${isUser ? "user" : ""}">
          ${isUser ? "" : `<span class="avatar">${mascotSVG(46)}</span>`}
          <div class="msg">${html}</div>
        </div>`);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // event delegation — ผูก listener ที่คอนเทนเนอร์ครั้งเดียว ทำงานกับปุ่มที่ถูกสร้างใหม่ทุกรอบ
    choicesBox.addEventListener("click", (e) => {
      const b = e.target.closest(".choice");
      if (!b || b.disabled) return;
      [...choicesBox.children].forEach((c) => (c.disabled = true));
      onAnswer(Number(b.dataset.i));
    });

    function setChoices(items) {
      choicesBox.innerHTML = "";
      items.forEach((label, i) => {
        const b = document.createElement("button");
        b.className = "choice";
        b.type = "button";
        b.textContent = label;
        b.dataset.i = i;
        choicesBox.appendChild(b);
      });
    }

    function moveWalker() {
      const done = answers.length;
      walker.style.left = `calc(${(done / quiz.length) * 100}% - ${done === quiz.length ? 20 : 0}px)`;
    }

    function onAnswer(index) {
      if (step === 0) {
        choicesBox.innerHTML = ""; // ลบปุ่มคำตอบชุดเก่าทิ้ง
        addBubble(["พร้อมแล้ว! ไปกันเลย 🚀", "ขอเริ่มเบาๆ ก่อน 😌"][index], true);
        askCareer();
      } else if (step === 1) {
        step = 2; // จบเฟสเลือกอาชีพ เริ่มเฟสควิซ
        careerChoice = careers[index].id;
        addBubble(careers[index].icon + " " + careers[index].name, true);
        extraBox.innerHTML = ""; // ลบการ์ดเลือกอาชีพออกเมื่อเริ่มควิซ
        addBubble(`จดจำไว้แล้ว! เราจะใช้เป้าหมายนี้ช่วยวิเคราะห์ว่าเราตรงกับอาชีพนี้แค่ไหน 😊<br>เริ่มข้อแรกเลย — ข้อที่มีเฉลยจะบอกผลถูก/ผิดทันทีนะ`);
        askQuestion(0);
      } else {
        const item = quiz[step - 2];
        const isObj = typeof item.correctIndex === "number";
        const score = isObj ? (index === item.correctIndex ? 100 : 0) : Math.round(100 - index * (100 / (item.choices.length - 1)));
        answers.push({ category: item.category, skill_name: item.skill_name || null, skill_id: item.skill_id || null, index, correct: isObj ? index === item.correctIndex : null, score });

        // แสดงคำตอบ + เฉลยทันที (เฉพาะข้อที่มีคำตอบถูก)
        addBubble(item.choices[index], true);
        if (isObj) {
          if (index === item.correctIndex) {
            addBubble(`✅ <b>ถูกต้อง!</b> ได้ <b>100</b> คะแนน — เก่งมาก!`);
          } else {
            addBubble(`❌ <b>ยังไม่ถูก</b> (ได้ 0 คะแนน) — ข้อที่ถูกคือ "<b>${item.choices[item.correctIndex]}</b>" ไม่เป็นไรนะ เรียนกันไปเรื่อยๆ 🌱`);
          }
        }
        const next = step - 2 + 1;
        step++;
        if (next < quiz.length) askQuestion(next);
        else finish();
      }
    }

    function askCareer() {
      step = 1;
      addBubble("ก่อนเริ่ม ขอถามอีกเรื่อง — <b>เราอยากเป็นอะไร หรือสนใจ/ถนัดแบบไหน?</b> เลือกจากการ์ดด้านล่างได้เลย");
      extraBox.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "career-grid";
      grid.addEventListener("click", (e) => {
        const b = e.target.closest(".career-card");
        if (!b || grid.querySelector(".selected")) return;
        grid.querySelectorAll(".career-card").forEach((x) => x.classList.remove("selected"));
        b.classList.add("selected");
        onAnswer(Number(b.dataset.i));
      });
      careers.forEach((c, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "career-card";
        b.dataset.i = i;
        b.innerHTML = `<span class="ic">${c.icon}</span>${c.name}`;
        grid.appendChild(b);
      });
      extraBox.appendChild(grid);
      extraBox.scrollIntoView({ behavior: "smooth" });
    }

    function askQuestion(i) {
      bridge.style.visibility = "visible";
      moveWalker();
      const item = quiz[i];
      addBubble(`<span class="cat-chip ${item.category}">${item.label}</span><br>ข้อที่ ${i + 1}/${quiz.length} — ${item.q}`);
      setChoices(item.choices);
    }

    function categoryScore(cat) {
      const list = answers.filter(a => a.category === cat);
      if (!list.length) return 0;
      return Math.round(list.reduce((s, a) => s + a.score, 0) / list.length);
    }

    function buildResult() {
      const tech = categoryScore("technical");
      const soft = categoryScore("soft");
      const career = categoryScore("career");
      const prof = profiles[careerChoice] || profiles.unsure;
      const match = Math.round(tech * prof.weights.technical + soft * prof.weights.soft + career * prof.weights.career);
      const missing = [];
      if (tech < 70) missing.push("พื้นฐาน Excel / SQL");
      if (career < 70) missing.push("ทักษะการเรียนรู้ด้วยตนเอง");
      if (soft < 70) missing.push("ทักษะการทำงานร่วมกับผู้อื่น");
      if (!missing.length) missing.push("ยังไม่มี — เก็บรายละเอียดเพิ่มจากการเรียนจริงได้เลย");
      return {
        goalCareer: prof.name,
        careerChoice,
        categoryScores: { technical: tech, soft, career },
        careerReadiness: Math.round((tech + soft + career) / 3),
        career: prof.name,
        careerMatch: match,
        answers,
        missingSkills: missing,
        jobMatch: "ตำแหน่งงานที่ตรงกับทักษะ: จะอัปเดตจากฐานข้อมูลตลาดงานจริงเร็วๆ นี้",
      };
    }

    function validAiQuiz(data) {
      if (!data || typeof data !== "object" || !data.question || !Array.isArray(data.choices) || data.choices.length !== 4) return null;
      const skill = String(data.skill_name || data.skill || "");
      if (!skillIds[skill]) return null;
      const choices = data.choices.map(c => typeof c === "string" ? c : c.text).filter(Boolean);
      if (choices.length !== 4 || data.correct_answer == null) return null;
      let correctIndex = Number.isInteger(data.correct_index) ? data.correct_index : (Number.isInteger(data.correct_answer) ? data.correct_answer : choices.findIndex(c => c === data.correct_answer));
      if (correctIndex < 0 || correctIndex > 3) { const letter = String(data.correct_answer).toUpperCase(); correctIndex = "ABCD".indexOf(letter); }
      if (correctIndex < 0) return null;
      return { category:"technical", label:"ทักษะเทคนิค", q:String(data.question), choices, correctIndex, skill_name:skill, skill_id:skillIds[skill], explanation:data.explanation || "" };
    }

    async function prepareQuiz() {
      const fallback = window.MOCK_DATA.quiz;
      try {
        const cached = sessionStorage.getItem("sbAssessmentQuiz");
        if (cached) { const parsed=JSON.parse(cached); if(Array.isArray(parsed) && parsed.length) return parsed; }
      } catch (e) {}
      try {
        const skills = Object.keys(skillIds);
        const generated = await SkillBridgeAPI.generateAssessmentQuiz({ target_career:"Data Analyst", skills, current_skill_levels:{}, baseline:true, requested_question_count:10 });
        const generatedQuestions = (generated.questions || []).map(validAiQuiz).filter(Boolean);
        if (generatedQuestions.length >= skills.length && skills.every(s => generatedQuestions.some(q => q.skill_name === s))) {
          const merged=[...generatedQuestions, ...fallback.filter(q=>q.category !== "technical")]; sessionStorage.setItem("sbAssessmentQuiz",JSON.stringify(merged)); return merged;
        }
      } catch (e) { console.warn("AI quiz unavailable; using fixed assessment.", e); }
      return fallback;
    }

    async function finish() {
      moveWalker();
      const r = buildResult();

      // สรุปคะแนนแยก 3 หมวด + อาชีพแนะนำ
      addBubble(`จบแล้ว! นี่คือผลวิเคราะห์ของเรา 🛸✨
        <div class="results-grid">
          <div class="card res-card"><div class="pct">${r.categoryScores.technical}%</div><div class="name">💻 ทักษะเทคนิค</div></div>
          <div class="card res-card"><div class="pct">${r.categoryScores.soft}%</div><div class="name">🤝 ทักษะด้านคน</div></div>
          <div class="card res-card"><div class="pct">${r.categoryScores.career}%</div><div class="name">🎯 ความพร้อมสู่อาชีพ</div></div>
        </div>
        <div class="card glow" style="margin-top:14px; text-align:center;">
          <div style="color:var(--text-dim); font-size:.85rem;">อาชีพที่ตรงกับเราตอนนี้</div>
          <div style="font-weight:800; font-size:1.1rem; margin:4px 0;">${r.career}</div>
          <div style="color:var(--lime); font-weight:700;">ตรงกัน ${r.careerMatch}%</div>
        </div>`);
      choicesBox.innerHTML = "";
      extraBox.innerHTML = "";

      // เก็บผลไว้ให้หน้าพาสปอร์ต/แดชบอร์ดใช้
      sessionStorage.setItem("sbResult", JSON.stringify(r));
      const userId = sessionStorage.getItem("sbUserId");
      if (userId && window.SkillBridgeAPI) {
        Promise.allSettled([
          SkillBridgeAPI.saveDashboardResult(userId, r),
          SkillBridgeAPI.saveUserSkills(userId, measuredSkillScores())
        ]).catch(() => {});
      }

      try {
        // จุดเชื่อม MySQL — บันทึกคำตอบ (ตอนนี้ยังเป็น mock)
        await window.SkillBridgeAPI.saveAssessment({ careerChoice, answers });
        // จุดเชื่อม AI — ส่งผลให้โมเดลวิเคราะห์ต่อ (ตอนนี้ยังเป็น mock)
        await window.SkillBridgeAPI.aiPredict({ careerChoice, answers });
      } catch (e) { /* ยังไม่ต่อ backend — ข้ามไปได้ */ }

      addBubble("ไปดูพาสปอร์ตทักษะกันเลย!");
      setTimeout(() => (location.href = "passport.html"), 1600);
    }

    // โหมดใจเย็น
    document.getElementById("calmBtn").onclick = (e) => {
      document.body.classList.toggle("calm");
      e.target.textContent = document.body.classList.contains("calm") ? "🌙 กลับโหมดปกติ" : "🧘 โหมดใจเย็น";
    };

    // เริ่มบทสนทนา; quiz generation is cached and never blocks fallback use
    addBubble("สวัสดี! เราคือบริดจ์ 🛸 พร้อมค้นหาความสามารถของตัวเองหรือยัง?");
    setChoices(["พร้อมแล้ว! 🚀", "ขอเริ่มเบาๆ ก่อน 😌"]);
    prepareQuiz().then(q => { quiz = q; }).catch(() => {});
  </script>
</body>
</html>
