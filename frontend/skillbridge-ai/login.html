<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — SkillBridge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* หน้าล็อกอิน — รวมจาก frontend/index.html ของทีม backend (คง logic API เดิม) */
    .login-wrap { min-height: calc(100vh - 130px); display: grid; place-items: center; }
    .login-card { width: 100%; max-width: 400px; padding: 36px 32px; }
    .login-card h2 { text-align: center; margin-bottom: 6px; }
    .login-card .sub { text-align: center; color: var(--text-dim); font-size: .9rem; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .88rem; color: var(--text-dim); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 14px; border-radius: 10px; font-family: inherit; font-size: .95rem;
      border: 1px solid var(--line); background: var(--bg-deep); color: var(--text); outline: none;
    }
    .field input:focus { border-color: var(--lime); box-shadow: var(--glow-lime); }
    .btn-submit { width: 100%; padding: 12px; font-size: 1rem; margin-top: 8px; }
    #error-message { color: #ff8f8f; font-size: .85rem; margin-top: 12px; text-align: center; display: none; }
  </style>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">🛸 SkillBridge AI</a>
  </header>

  <main class="login-wrap">
    <div class="card glow login-card">
      <h2>เข้าสู่ระบบ</h2>
      <p class="sub">ยินดีต้อนรับกลับมา นักสำรวจ 🛸</p>

      <!-- logic เดิมของทีม backend: POST /api/login แล้วเก็บ user ไว้ต่อไปหน้า dashboard -->
      <form id="loginForm">
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้งาน" />
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" required placeholder="กรอกรหัสผ่าน" />
        </div>
        <button type="submit" class="btn btn-lime btn-submit">เข้าสู่ระบบ</button>
      </form>
      <div id="error-message"></div>

      <p style="text-align:center; margin-top:18px; font-size:.88rem; color:var(--text-dim);">
        ยังไม่มีบัญชี? <a class="btn btn-ghost" href="assessment.html" style="padding:8px 16px; font-size:.88rem;">สมัครใช้งาน</a>
      </p>
    </div>
  </main>

  <script src="js/mockData.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');

      errorDiv.style.display = 'none';

      try {
        // ส่งข้อมูลไปยัง Backend API (/api/auth/login)
       const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // เก็บข้อมูล user ไว้ในเครื่องเพื่อเอาไปใช้ต่อหน้าแดชบอร์ด
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          errorDiv.textContent = data.error || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้";
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
